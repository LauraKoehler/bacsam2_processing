mcpc:

    number_conc:
      old: concent
      long_name: number concentration
      standard_name: number_concentration_of_aerosol_particles_in_air
      platform: mCPC
      units_old: 1/cm^3
      units: 1/m^3
      comment: coincidence corrected concentration

    counts:
      old: cnt_sec
      long_name: particle counts per second
      platform: mCPC
      units_old: 1/s
      units: 1/s
      comment: coincidence corrected concentration

    p_air:
      old: pressur
      long_name: air pressure
      standard_name: air_pressure
      platform: mCPC
      units_old: mbar
      units: Pa
      comment: ambient pressure at inlet

    flow_rate:
      old: smpflow
      long_name: sample flow rate
      platform: mCPC
      units_old: cm^3/min
      units: m^3/s

    error:
      old: err_num
      long_name: all errors
      platform: mCPC
      units_old: 1
      units: 1
      comment: see manual for error codes

